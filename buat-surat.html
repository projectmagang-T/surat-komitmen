<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Surat Baru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" data-wajib-login>
  <div id="isi-halaman" class="container py-4 d-none" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Buat Surat Baru</h1>
      <div>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Kembali</a>
        <button id="tombol-keluar" class="btn btn-outline-secondary btn-sm">Keluar</button>
      </div>
    </div>

    <div class="alert alert-info py-2">
      Nomor surat dibuat otomatis oleh sistem saat surat disimpan.
    </div>

    <form id="form-surat" class="card shadow-sm p-4"    >
      <div class="row g-3">
        <div class="col-md-6">
          <label for="tanggal" class="form-label">Tanggal surat</label>
          <input type="date" id="tanggal" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="nama_supervisor" class="form-label">Nama supervisor / pembuat laporan</label>
          <input type="text" id="nama_supervisor" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="departemen" class="form-label">Departemen</label>
          <input type="text" id="departemen" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="nama_pekerja" class="form-label">Nama pekerja</label>
          <input type="text" id="nama_pekerja" class="form-control" maxlength="100" required>
        </div>
        <div class="col-12">
          <label for="nama_pekerjaan" class="form-label">Nama pekerjaan / kegiatan</label>
          <input type="text" id="nama_pekerjaan" class="form-control" maxlength="200" required>
        </div>
        <div class="col-12">
          <label for="periode_kerja" class="form-label">Periode kerja</label>
          <input type="text" id="periode_kerja" class="form-control" maxlength="100"
                 placeholder="Contoh: 1 Oktober 2026 - 31 Oktober 2026" required>
        </div>
        <div class="col-12">
          <label for="kesalahan_pekerja" class="form-label">Kesalahan pekerja</label>
          <textarea id="kesalahan_pekerja" class="form-control" rows="3" maxlength="2000" required></textarea>
        </div>
        <div class="col-12">
          <label for="isi_komitmen" class="form-label">Isi komitmen</label>
          <textarea id="isi_komitmen" class="form-control" rows="4" maxlength="2000" required></textarea>
        </div>
        <div class="col-12">
          <label for="keterangan" class="form-label">Keterangan tambahan <span class="text-muted">(boleh kosong)</span></label>
          <textarea id="keterangan" class="form-control" rows="2" maxlength="1000"></textarea>
        </div>
      </div>

      <div id="pesan" class="mt-3"></div>
      <button type="submit" class="btn btn-primary mt-3">Simpan &amp; Kirim</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/surat.js"></script>
</body>
</html>
