<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Supervisor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" data-wajib-login>
  <div id="isi-halaman" class="container py-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0">Dashboard Supervisor</h1>
      <div>
        <a href="buat-surat.html" class="btn btn-primary btn-sm me-2">+ Buat Surat Baru</a>
        <button id="tombol-keluar" class="btn btn-outline-secondary btn-sm">Keluar</button>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-total">-</div><small class="text-muted">Total Surat</small>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-menunggu">-</div><small class="text-muted">Menunggu Persetujuan</small>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-revisi">-</div><small class="text-muted">Perlu Revisi</small>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-ditolak">-</div><small class="text-muted">Ditolak</small>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-hrd">-</div><small class="text-muted">Menunggu HRD</small>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card shadow-sm text-center p-3">
          <div class="h3 mb-0" id="angka-selesai">-</div><small class="text-muted">Surat Selesai</small>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Daftar Surat</div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nomor Surat</th><th>Tanggal</th><th>Pekerja</th>
              <th>Pekerjaan</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="badan-tabel">
            <tr><td colspan="6" class="text-center text-muted">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/status.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
