<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Digital Surat Komitmen Kerja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm p-4" style="max-width: 380px; width: 100%;">
      <h1 class="h4 text-center mb-4">Sistem Digital Surat Komitmen Kerja</h1>

      <form id="form-login">
        <label for="pin" class="form-label">PIN Supervisor</label>
        <input type="password" id="pin" class="form-control mb-3"
               inputmode="numeric" autocomplete="current-password" required>
        <div id="pesan"></div>
        <button type="submit" class="btn btn-primary w-100">Masuk</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</body>
</html>
