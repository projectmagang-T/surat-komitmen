
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login | Sistem Digital Surat Komitmen Kerja</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">

    <div class="card login-card border-0 shadow-sm w-100">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="login-icon mx-auto mb-3">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="28" height="28"
                 fill="none" stroke="currentColor"
                 stroke-width="2" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="m9 12 3 3L22 5"/>
            </svg>
          </div>

          <h1 class="h5 fw-bold mb-2">
            Surat Komitmen Kerja
          </h1>

          <p class="text-secondary small mb-0">
            Sistem Digital Pengelolaan Surat
          </p>
        </div>

        <hr class="mb-4">

        <form id="form-login">
          <label for="pin" class="form-label fw-medium small">
            PIN Supervisor
          </label>

          <input
            type="password"
            id="pin"
            class="form-control mb-3"
            placeholder="Masukkan PIN Anda"
            inputmode="numeric"
            autocomplete="current-password"
            required
          >

          <div id="pesan" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary w-100">
            Masuk &rarr;
          </button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
          Akses khusus Supervisor
        </p>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
